<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finca La Esperanza">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finca La Esperanza</title>
<style>
  :root{
    --bg:#EFEFF3; --surface:#FFFFFF; --surface-press:#F1F1F4;
    --label:#0E0F13; --secondary:#8A8A8F; --tertiary:#C3C3C8;
    --separator:rgba(60,60,67,.13);
    --accent:#137A4F; --accent-press:#0F6341; --accent-soft:#E4F1EA;
    --gold:#B8871C; --gold-soft:#F6ECD3; --rust:#BB4D2C; --rust-soft:#F7E7E0;
    --navy:#1B3A5B; --slate:#5E6B78; --danger:#D8452E; --danger-soft:#FBE6E2;
    --radius:16px; --radius-lg:22px;
    --shadow-card:0 1px 2px rgba(16,17,19,.04), 0 8px 22px rgba(16,17,19,.05);
    --shadow-btn:0 1px 2px rgba(16,17,19,.10);
    --tap:54px; font-size:17px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    line-height:1.45;-webkit-font-smoothing:antialiased;}
  .app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .ic{width:1.4em;height:1.4em;display:inline-block;vertical-align:middle;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

  header{position:sticky;top:0;z-index:20;background:rgba(248,248,250,.80);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--separator);padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;display:flex;align-items:center;gap:10px;}
  header .badge{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#fff;box-shadow:0 0 0 .5px var(--separator);}
  header .wm{flex:1;font-size:1.02rem;font-weight:700;letter-spacing:-.2px;}
  header .gear{background:none;border:none;color:var(--accent);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  header .gear:active{background:var(--surface-press);} header .gear .ic{width:23px;height:23px;}
  .statusline{text-align:center;font-size:.74rem;color:var(--secondary);padding:5px 16px 0;display:flex;align-items:center;justify-content:center;gap:6px;}
  .statusline .dot{width:7px;height:7px;border-radius:50%;background:#34C759;}
  .statusline.pend .dot{background:var(--gold);} .statusline.off .dot{background:#FF9F0A;}

  main{flex:1;padding:6px 16px 108px;}
  .screen{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}

  .ltitle{font-size:2rem;font-weight:800;letter-spacing:-.6px;margin:8px 0 2px;line-height:1.08;}
  .lsub{color:var(--secondary);font-size:.98rem;margin:0 0 18px;font-weight:500;}
  .backrow{padding:8px 0 2px;}
  .back{background:none;border:none;color:var(--accent);font-size:1.04rem;font-weight:500;cursor:pointer;padding:6px 6px 6px 0;display:inline-flex;align-items:center;gap:1px;margin-left:-4px;}
  .back .ic{width:22px;height:22px;}

  .ghead{font-size:.8rem;font-weight:600;color:var(--secondary);margin:24px 0 7px 16px;letter-spacing:.1px;}
  .ghead:first-child{margin-top:6px;}
  .ghead.rowh{display:flex;justify-content:space-between;align-items:center;margin-right:6px;}
  .ghead .addlink{color:var(--accent);font-weight:600;cursor:pointer;font-size:.86rem;}
  .lgroup{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card);}
  .grow{display:flex;align-items:center;gap:13px;padding:12px 14px;min-height:56px;position:relative;width:100%;background:var(--surface);border:none;text-align:left;color:var(--label);font-family:inherit;font-size:1.02rem;}
  .grow+.grow::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--separator);}
  .lgroup.inset .grow+.grow::before{left:60px;}
  .grow.tap{cursor:pointer;} .grow.tap:active{background:var(--surface-press);}
  .gtile{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;box-shadow:0 1px 1px rgba(0,0,0,.10);}
  .gtile .ic{width:20px;height:20px;}
  .gtx{flex:1;min-width:0;} .gtx b{font-weight:600;font-size:1.05rem;display:block;letter-spacing:-.2px;} .gtx small{color:var(--secondary);font-size:.86rem;}
  .gchev{color:var(--tertiary);flex:0 0 auto;} .gchev .ic{width:19px;height:19px;stroke-width:2.4;}
  .gval{color:var(--secondary);font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:1rem;}
  .badge-s{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;flex:0 0 auto;}
  .b-green{background:var(--accent-soft);color:var(--accent-press);} .b-gold{background:var(--gold-soft);color:var(--gold);}
  .b-rust{background:var(--rust-soft);color:var(--rust);} .b-slate{background:#E9EDF0;color:var(--slate);} .b-danger{background:var(--danger-soft);color:var(--danger);}

  .field{margin-bottom:6px;} .field>label{display:block;font-size:.8rem;font-weight:600;color:var(--secondary);margin:20px 0 8px 4px;}
  .field>label .soft{font-weight:400;}
  input[type=text],input[type=number],input[type=date],textarea,select{width:100%;min-height:var(--tap);border:.5px solid var(--separator);border-radius:14px;background:var(--surface);color:var(--label);font-size:1.08rem;padding:0 15px;font-family:inherit;box-shadow:var(--shadow-card);transition:border-color .15s,box-shadow .15s;}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238A8A8F' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px;}
  textarea{padding:13px 15px;min-height:70px;line-height:1.45;resize:vertical;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);}
  .row2{display:flex;gap:12px;} .row2 .field{flex:1;min-width:0;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:none;background:#E7E7EC;color:var(--label);border-radius:12px;padding:11px 16px;font-size:1.02rem;font-weight:500;cursor:pointer;min-height:46px;transition:transform .08s;}
  .chip:active{transform:scale(.95);} .chip.sel,.chip.gold.sel{background:var(--accent);color:#fff;}
  .chip.add{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--separator);}

  .total-box{background:var(--surface);border-radius:var(--radius);padding:15px 18px;display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;box-shadow:var(--shadow-card);}
  .total-box .lbl{font-weight:500;color:var(--secondary);} .total-box .val{font-size:1.7rem;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--accent);}

  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;}
  .kpi{background:var(--surface);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-card);}
  .kpi.tap{cursor:pointer;transition:transform .08s;} .kpi.tap:active{transform:scale(.97);background:var(--surface-press);}
  .kpi .kl{font-size:.8rem;color:var(--secondary);font-weight:600;margin-bottom:3px;}
  .kpi .kv{font-size:1.55rem;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
  .kpi.wide{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;}
  .kpi.wide .kv{font-size:1.9rem;}
  .alert{display:flex;gap:11px;align-items:center;background:var(--gold-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:.94rem;}
  .alert.dgr{background:var(--danger-soft);} .alert .ic{width:22px;height:22px;color:var(--gold);flex:0 0 auto;} .alert.dgr .ic{color:var(--danger);}
  .qbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
  .qbtn{background:var(--surface);border:none;border-radius:14px;padding:14px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;box-shadow:var(--shadow-card);color:var(--label);font-weight:600;font-size:.82rem;}
  .qbtn:active{background:var(--surface-press);} .qbtn .qi{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;} .qbtn .qi .ic{width:20px;height:20px;}

  .foto-btn{width:100%;min-height:var(--tap);border:none;background:var(--surface);border-radius:14px;color:var(--accent);font-weight:500;font-size:1.04rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--shadow-card);}
  .foto-btn:active{background:var(--surface-press);} .foto-btn .ic{width:22px;height:22px;}
  .foto-preview{margin-top:12px;position:relative;display:none;}
  .foto-preview img{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow-card);}
  .foto-preview .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer;}
  .foto-note{font-size:.82rem;color:var(--secondary);margin:8px 0 0 4px;}

  .save{width:100%;min-height:52px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:1.1rem;font-weight:600;letter-spacing:-.2px;cursor:pointer;margin-top:22px;box-shadow:var(--shadow-btn);transition:transform .08s,background .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .save:active{transform:scale(.985);background:var(--accent-press);} .save.gold{background:var(--gold);} .save.rust{background:var(--rust);} .save .ic{width:21px;height:21px;}
  .btn-outline{width:100%;min-height:var(--tap);border:none;background:var(--surface);border-radius:14px;font-size:1.04rem;font-weight:500;color:var(--accent);cursor:pointer;margin-bottom:11px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--shadow-card);}
  .btn-outline:active{background:var(--surface-press);} .btn-outline .ic{width:21px;height:21px;}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:500;cursor:pointer;font-size:.98rem;padding:10px 4px;}
  .danger-link{color:var(--danger);background:var(--surface);border:none;font-weight:500;cursor:pointer;font-size:1.02rem;padding:15px;width:100%;border-radius:14px;box-shadow:var(--shadow-card);margin-top:12px;}

  .seg{display:flex;background:#E4E4E9;border-radius:10px;padding:2px;margin:6px 0 18px;}
  .seg button{flex:1;min-height:38px;border:none;background:transparent;font-weight:600;font-size:.92rem;color:var(--label);border-radius:8px;cursor:pointer;transition:background .18s;letter-spacing:-.2px;}
  .seg button.sel{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);}
  .navsel{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
  .navsel button{width:38px;height:38px;border:none;background:var(--surface);border-radius:10px;color:var(--accent);font-size:1.3rem;cursor:pointer;box-shadow:var(--shadow-card);}
  .navsel b{min-width:130px;text-align:center;font-weight:700;}

  .card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-card);}
  .card h3{margin:0 0 10px;font-size:.82rem;font-weight:600;color:var(--secondary);letter-spacing:.1px;}
  .line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--separator);font-size:1.05rem;}
  .line:last-child{border-bottom:none;} .line .k{color:var(--label);} .line .v{font-weight:600;font-variant-numeric:tabular-nums;}
  .bigline{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px;}
  .bigline .k{font-weight:600;font-size:1.05rem;} .bigline .v{font-weight:800;font-size:1.6rem;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
  .pos{color:var(--accent);} .neg{color:var(--rust);}
  .chart svg{width:100%;height:auto;display:block;} .legend{display:flex;gap:18px;font-size:.8rem;color:var(--secondary);margin-top:10px;justify-content:center;} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

  .empty{text-align:center;color:var(--secondary);padding:52px 24px;} .empty .ic{width:42px;height:42px;color:var(--tertiary);margin-bottom:10px;}
  .rec-amt{font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .rdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;} .rdot.ing{background:var(--accent);} .rdot.egr{background:var(--rust);}
  .hint{font-size:.86rem;color:var(--secondary);margin:12px 4px 0;line-height:1.45;}
  .pill-ok{display:inline-block;background:var(--accent-soft);color:var(--accent-press);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:600;}

  .plan-item{display:flex;align-items:center;gap:10px;padding:11px 14px;position:relative;background:var(--surface);}
  .plan-item+.plan-item::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--separator);}
  .plan-item .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-press);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .plan-item .tx{flex:1;font-size:1rem;border:none;background:none;min-height:auto;padding:2px 0;box-shadow:none;} .plan-item .tx:focus{box-shadow:none;}
  .plan-item .mv{background:#EEE;border:none;color:var(--slate);width:30px;height:30px;border-radius:8px;font-size:1rem;cursor:pointer;flex:0 0 auto;}
  .plan-item .rm{background:none;border:none;color:var(--danger);font-size:1.15rem;cursor:pointer;flex:0 0 auto;padding:0 4px;}
  #planprev{margin-top:16px;display:none;} #planprev img{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow-card);}

  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(248,248,250,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--separator);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar .inner{max-width:540px;margin:0 auto;width:100%;display:flex;}
  .tabbar button{flex:1;background:none;border:none;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--secondary);font-size:.62rem;font-weight:600;cursor:pointer;}
  .tabbar button .ic{width:25px;height:25px;stroke-width:1.8;} .tabbar button.active{color:var(--accent);}

  .modal-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{background:var(--bg);width:100%;max-width:540px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;animation:slideup .25s ease;padding-bottom:env(safe-area-inset-bottom);}
  .modal-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
  .modal-head b{font-size:1.2rem;font-weight:800;letter-spacing:-.3px;} .modal-x{background:#E4E4E9;border:none;width:32px;height:32px;border-radius:50%;font-size:1rem;color:var(--secondary);cursor:pointer;}
  .modal-body{padding:0 18px 8px;} .modal-actions{padding:6px 18px 20px;}

  #toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);background:rgba(28,28,30,.95);color:#fff;padding:13px 18px;border-radius:14px;font-weight:500;display:flex;align-items:center;gap:16px;opacity:0;pointer-events:none;transition:.28s;z-index:70;max-width:90%;box-shadow:0 8px 26px rgba(0,0,0,.28);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;} #toast button{background:none;color:#5AC8FA;border:none;font-weight:600;cursor:pointer;font-size:1rem;padding:0;}

  .swrow{display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow-card);min-height:var(--tap);}
  .swrow .gtx b{font-weight:600;font-size:1.02rem;display:block;} .swrow .gtx small{color:var(--secondary);font-size:.84rem;}
  .sw{position:relative;width:52px;height:31px;border-radius:999px;background:#E3E3E8;border:none;flex:0 0 auto;cursor:pointer;transition:background .2s;}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s;}
  .sw.on{background:var(--accent);} .sw.on::after{transform:translateX(21px);}
  .cajasaldo{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-card);text-align:center;margin-bottom:16px;}
  .cajasaldo .kl{font-size:.82rem;color:var(--secondary);font-weight:600;}
  .cajasaldo .kv{font-size:2.4rem;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.1;}
  .mov-caja{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;background:var(--surface);}
  .mov-caja+.mov-caja::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--separator);}
  .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#E7E7EC;box-shadow:0 0 0 .5px var(--separator);}
  .avatar-ph{width:44px;height:44px;border-radius:50%;flex:0 0 auto;background:#E7E7EC;display:flex;align-items:center;justify-content:center;color:var(--slate);}
  .avatar-ph .ic{width:26px;height:26px;}
  .hero-foto{width:100%;max-height:300px;object-fit:cover;border-radius:var(--radius);display:block;box-shadow:var(--shadow-card);margin-bottom:16px;}
  .foto-circ{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 4px;}
  .foto-circ .big{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#E7E7EC;box-shadow:0 0 0 .5px var(--separator);}
  .foto-circ .bigph{width:120px;height:120px;border-radius:50%;background:#E7E7EC;display:flex;align-items:center;justify-content:center;color:var(--slate);}
  .foto-circ .bigph .ic{width:56px;height:56px;}
  .foto-circ .lnk{background:none;border:none;color:var(--accent);font-weight:600;font-size:.98rem;cursor:pointer;padding:4px;}
  .galgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .galcell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:none;padding:0;background:#E7E7EC;cursor:pointer;box-shadow:var(--shadow-card);}
  .galcell img{width:100%;height:100%;object-fit:cover;display:block;}
  .galcell .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:.66rem;font-weight:600;padding:12px 5px 4px;text-align:center;}
  .galadd{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--tertiary);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--accent);font-size:.76rem;font-weight:600;cursor:pointer;}
  .galadd .ic{width:26px;height:26px;}
  .lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.94);display:flex;flex-direction:column;}
  .lightbox .lbtop{display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;}
  .lightbox .lbx{background:rgba(255,255,255,.18);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.1rem;cursor:pointer;}
  .lightbox .lbimg{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;min-height:0;}
  .lightbox .lbimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;}
  .lightbox .lbinfo{color:#fff;padding:16px 20px calc(env(safe-area-inset-bottom) + 20px);text-align:center;}
  .lightbox .lbinfo b{display:block;font-size:1.05rem;} .lightbox .lbinfo small{color:#B8B8BE;}
  .lightbox .lbdel{background:none;border:none;color:#FF6B5B;font-weight:600;font-size:1rem;cursor:pointer;margin-top:14px;padding:8px;}
  .hero-neta{background:linear-gradient(135deg,#137A4F,#0F6341);border-radius:var(--radius-lg);padding:22px 22px 20px;color:#fff;box-shadow:0 8px 24px rgba(19,122,79,.28);margin-bottom:16px;}
  .hero-neta.rojo{background:linear-gradient(135deg,#C0472B,#9E3A22);box-shadow:0 8px 24px rgba(187,77,44,.28);}
  .hero-neta .hl{font-size:.82rem;opacity:.85;font-weight:600;letter-spacing:.2px;}

function icon(n){ return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`; }

const VACAS_FIJAS=['Chequear las vacas.','Revisar agua y alimentación de las vacas.','Estar pendiente de cualquier novedad en las vacas.','Estar pendiente del parto de alguna vaca.'];
const TAREAS_COMUNES=['Cosechar cacao y venderlo.','Cosechar verde y venderlo.','Limpiar el verde con guadaña.','Limpiar con machete.','Terminar burrito.','Revisar alambrada.','Comprar vacuna para el carbunco.','Cosechar y limpiar maqueño.','Eliminar casas de cubos.'];

const ESTADOS_CACAO=['En baba','Semi seco','Seco'];
function esCacao(nombre){ return (nombre||'').toLowerCase().includes('cacao'); }
const ESTADOS_ANIMAL=['Vacía','Preñada','Lactando','Ternero/a'];
const RAZAS=['Mestiza','Brahman','Holstein','Jersey','Otra'];
const TIPO_SALUD=['Vacuna','Desparasitación','Tratamiento','Revisión','Otro'];
const CAT_INV=['Medicina','Alimento','Material','Agrícola','Otro'];
const DEFAULTS={
  trabajadores:['Washington','Bethy'],
  formasPago:[{n:'Jornal',p:15},{n:'Guadaña',p:30},{n:'Rodeo de vacas',p:5},{n:'Extra',p:0,editable:true}],
  productosVenta:[{n:'Cacao en libras',u:'libras'},{n:'Caja de verde',u:'cajas'},{n:'Litro de leche',u:'litros'}],
  gastos:['Alimentación animal','Medicina','Vacuna','Combustible','Fertilizante','Herramientas','Mantenimiento','Transporte','Otro'],
  compradores:[], ultimoPrecio:{},
  appsUrl:'https://script.google.com/macros/s/AKfycbwWAndNPTO6QF_ZEzbxLFGvbuyhc53Q8ezvrvV9WGJWUn_Cwyw6xRYJSuAweMtWikrG/exec',
  token:'1108', sheetUrl:'', ultimaBajada:0
};
let META=null;
const STORES=['registros','produccion','animales','leche','salud','inventario','caja','galeria','fotos','meta'];

let db=null, mem={}, useMem=false;
function M(s){ return mem[s]||(mem[s]=new Map()); }
function openDB(){ return new Promise((res)=>{ let done=false; const finish=()=>{ if(!done){done=true;res();} };
  const t=setTimeout(()=>{ useMem=true; finish(); },1500);
  try{ if(!('indexedDB' in window)||!window.indexedDB){ useMem=true; clearTimeout(t); return finish(); }
    const rq=indexedDB.open('finca-esperanza',4);
    rq.onupgradeneeded=e=>{ const d=e.target.result;
      STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:s==='meta'?'k':'id'}); }); };
    rq.onsuccess=e=>{ db=e.target.result; clearTimeout(t); finish(); };
    rq.onerror=()=>{ useMem=true; clearTimeout(t); finish(); };
    rq.onblocked=()=>{ useMem=true; clearTimeout(t); finish(); };
  }catch(e){ useMem=true; clearTimeout(t); finish(); } }); }
function txs(s,m='readonly'){ return db.transaction(s,m).objectStore(s); }
function put(s,v){ if(useMem){ M(s).set(v.id||v.k,v); return Promise.resolve(); } return new Promise((res,rej)=>{ const r=txs(s,'readwrite').put(v); r.onsuccess=res; r.onerror=()=>rej(r.error); }); }
function del(s,id){ if(useMem){ M(s).delete(id); return Promise.resolve(); } return new Promise((res,rej)=>{ const r=txs(s,'readwrite').delete(id); r.onsuccess=res; r.onerror=()=>rej(r.error); }); }
function get(s,id){ if(useMem){ return Promise.resolve(M(s).get(id)); } return new Promise((res,rej)=>{ const r=txs(s).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function all(s){ if(useMem){ return Promise.resolve([...M(s).values()]); } return new Promise((res,rej)=>{ const r=txs(s).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
async function loadMeta(){ const s=await get('meta','config'); META=Object.assign({},DEFAULTS, s?s.v:{});
  META.ultimoPrecio=Object.assign({},(s&&s.v.ultimoPrecio)||{}); META.compradores=(s&&s.v.compradores)||[];
  if(!META.appsUrl){ META.appsUrl=DEFAULTS.appsUrl; META.token=META.token||DEFAULTS.token; } }
async function saveMeta(){ await put('meta',{k:'config',v:META}); }

const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_AB=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaLarga(){ const d=new Date(); return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`; }
function num(v){ if(typeof v==='number')return v; if(v==null)return 0; return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0; }
function money(n){ return '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function nuevoId(){ const d=new Date(),p=x=>String(x).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.random().toString(36).slice(2,4)}`; }
function parseFecha(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function lunesDe(d){ const day=(d.getDay()+6)%7; const l=new Date(d); l.setDate(d.getDate()-day); l.setHours(0,0,0,0); return l; }
function semanaDe(iso){ const l=lunesDe(parseFecha(iso)); const dom=new Date(l); dom.setDate(l.getDate()+6); return `${l.getDate()} ${MESES_AB[l.getMonth()]} - ${dom.getDate()} ${MESES_AB[dom.getMonth()]} ${dom.getFullYear()}`; }
function mismaSemana(a,b){ return semanaDe(a)===semanaDe(b); }
function ymDe(iso){ return iso.slice(0,7); }
function ymActual(){ return hoyISO().slice(0,7); }
function ymLabel(ym){ const [y,m]=ym.split('-'); return `${MESES[+m-1]} ${y}`; }
function ymShift(ym,delta){ let [y,m]=ym.split('-').map(Number); m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+String(m).padStart(2,'0'); }
function diasEntre(a,b){ return Math.round((parseFecha(b)-parseFecha(a))/86400000); }
function semanaLabelActual(){ const l=lunesDe(new Date()); const dom=new Date(l); dom.setDate(l.getDate()+6); const mes=MESES[dom.getMonth()].toUpperCase();
  return l.getMonth()===dom.getMonth()?`SEMANA ${l.getDate()} - ${dom.getDate()} DE ${mes}`:`SEMANA ${l.getDate()} ${MESES_AB[l.getMonth()].toUpperCase()} - ${dom.getDate()} ${mes}`; }
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function opts(arr,sel){ return arr.map(o=>`<option ${o===sel?'selected':''}>${o}</option>`).join(''); }

function comprimir(file,maxDim=1280,q=0.68){ return new Promise((res,rej)=>{ const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{ let{width:w,height:hh}=img; if(w>=hh&&w>maxDim){ hh=Math.round(hh*maxDim/w); w=maxDim; } else if(hh>maxDim){ w=Math.round(w*maxDim/hh); hh=maxDim; }
    const c=document.createElement('canvas'); c.width=w; c.height=hh; c.getContext('2d').drawImage(img,0,0,w,hh); c.toBlob(b=>{ URL.revokeObjectURL(url); res(b); },'image/jpeg',q); };
  img.onerror=e=>{ URL.revokeObjectURL(url); rej(e); }; img.src=url; }); }
function blobURL(b){ return b?URL.createObjectURL(b):''; }
function loadImg(src){ return new Promise(r=>{ const i=new Image(); let done=false; const fin=v=>{ if(!done){done=true;r(v);} }; i.onload=()=>fin(i); i.onerror=()=>fin(null); setTimeout(()=>fin(null),4000); i.src=src; }); }

async function fotoSrc(reg){ if(reg&&reg.fotoId){ const f=await get('fotos',reg.fotoId); if(f&&f.blob) return blobURL(f.blob); }
  return (reg&&(reg.fotoUrl||reg.comprobanteUrl))||''; }
function blob2b64(b){ return new Promise((res,rej)=>{
  try{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(b); }
  catch(e){
    // respaldo: algunos navegadores devuelven el archivo en otro formato
    try{ b.arrayBuffer().then(buf=>{ let bin=''; const arr=new Uint8Array(buf);
      for(let i=0;i<arr.length;i++) bin+=String.fromCharCode(arr[i]);
      res('data:'+(b.type||'image/jpeg')+';base64,'+btoa(bin)); }).catch(rej); }
    catch(e2){ rej(e2); }
  } }); }
function b642blob(durl){ const [m,b64]=durl.split(','); const mime=(m.match(/:(.*?);/)||[])[1]||'image/jpeg'; const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }

function online(){ return navigator.onLine; }
const SYNCST=['registros','produccion','animales','leche','salud','inventario','caja','galeria'];
async function pendientes(){ let p=[]; for(const s of SYNCST){ const items=await all(s); p=p.concat(items.filter(r=>r.sync!=='ok').map(r=>({store:s,r}))); } return p; }
// vivos = no borrados (el borrado deja marca para que otros teléfonos lo sepan)
async function vivos(store){ return (await all(store)).filter(r=>!r.borrado); }
async function borrarReg(store,id){ const r=await get(store,id);
  if(!r){ await del(store,id); return; }
  r.borrado=true; r.sync='pend'; r.modificado=Date.now();
  // libera espacio en el teléfono: la imagen ya está en Drive y el enlace queda guardado
  if(r.fotoId){ try{ await del('fotos',r.fotoId); }catch(e){} r.fotoId=null; }
  await put(store,r);
  actualizarSync(); sincronizar(); }
async function actualizarSync(){ const bar=$('#statusline'),txt=$('#statustext'); const p=await pendientes(); bar.className='statusline';
  if(!online()){ bar.classList.add('off'); txt.textContent=p.length?`Sin señal · ${p.length} por subir`:'Sin señal'; return; }
  if(ultimoErrorBajada){ bar.classList.add('off'); txt.textContent='⚠️ No recibe datos · toca aquí'; return; }
  if(p.length){ bar.classList.add('pend'); txt.textContent=META.appsUrl?`${p.length} por subir`:`${p.length} guardados en el teléfono`; } else txt.textContent='Todo sincronizado'; }
let sincronizando=false, bajadaCompletaHecha=false;
async function sincronizar(manual){ if(!META.appsUrl||!online()||sincronizando){ actualizarSync(); return; }
  sincronizando=true;
  try{
    const sub=await subir();
    const baj=await bajar();
    if(manual){ toast(baj<0?(ultimoErrorBajada||'No se pudo conectar'):`Listo · ${sub} subido(s), ${baj} recibido(s)`); }
    else if(baj>0){ toast(`${baj} registro(s) nuevo(s) de otro teléfono`); refrescarVista(); }
  }catch(e){ if(manual) toast('No se pudo sincronizar'); }
  sincronizando=false; actualizarSync(); }

async function subir(){ let n=0, fallosRed=0;
  for(const {store,r} of await pendientes()){
    // La foto es opcional: si falla, se sube igual el dato (nunca bloquea la sincronización)
    let foto=null;
    if(r.fotoId && !r.fotoUrl){ try{ const f=await get('fotos',r.fotoId); if(f&&f.blob) foto=await blob2b64(f.blob); }catch(e){ foto=null; } }
    if(!r.modificado) r.modificado=Date.now();
    try{
      const resp=await fetch(META.appsUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:META.token,tabla:store,registro:limpiar(r),foto})});
      const data=await resp.json();
      if(data&&data.ok){ r.sync='ok'; if(data.fotoUrl){ r.fotoUrl=data.fotoUrl; r.comprobanteUrl=data.fotoUrl; } await put(store,r); n++; }
      else if(data&&data.error==='token'){ break; }        // token malo: no insistir
      else { fallosRed++; if(fallosRed>=3) break; }         // error puntual: sigue con los demás
    }catch(e){ break; }                                     // sin conexión: parar y reintentar luego
  }
  return n; }

let ultimoErrorBajada='';
async function bajar(){
  try{
    // La primera bajada de cada sesión trae TODO: así ningún registro se queda atrás
    const usarCursor = bajadaCompletaHecha && META.ultimaBajada;
    const url=META.appsUrl+'?token='+encodeURIComponent(META.token)+(usarCursor?('&desde='+META.ultimaBajada):'');
    const resp=await fetch(url,{method:'GET'});
    const txt=await resp.text();
    let data=null; try{ data=JSON.parse(txt); }catch(e){}
    if(!data){ ultimoErrorBajada = txt.indexOf('Finca La Esperanza')>=0
        ? 'El script de Google es la versión vieja. Hay que actualizarlo y volver a implementarlo.'
        : 'Google no devolvió datos. Revisa que el script esté implementado como "Aplicación web" para "Cualquiera".';
      return -1; }
    if(!data.ok){ ultimoErrorBajada = data.error==='token' ? 'El token no coincide con el del script.' : ('Error del script: '+data.error); return -1; }
    ultimoErrorBajada='';
    let n=0;
    for(const store of SYNCST){
      const remotos=data.datos[store]||[];
      for(const rem of remotos){
        if(!rem.id) continue;
        const loc=await get(store,rem.id);
        const mRem=Number(rem.modificado||0), mLoc=Number((loc&&loc.modificado)||0);
        if(loc && mLoc>=mRem) continue;              // lo mío es igual o más nuevo
        const fus=Object.assign({},loc||{},rem);
        fus.borrado = rem.borrado===true || rem.borrado==='TRUE';
        fus.sync='ok';
        if(loc && loc.fotoId) fus.fotoId=loc.fotoId; // conservo la foto local si la tengo
        ['cantidad','precio','total','monto','litros','stock'].forEach(k=>{ if(fus[k]!=null&&fus[k]!=='') fus[k]=num(fus[k]); });
        ['caja','pagado','activo'].forEach(k=>{ if(fus[k]==='TRUE'||fus[k]===true) fus[k]=true; else if(fus[k]===''||fus[k]==='FALSE'||fus[k]==null) fus[k]=false; });
        await put(store,fus); n++;
      }
    }
    bajadaCompletaHecha=true;
    if(data.servidor){ META.ultimaBajada=data.servidor; await saveMeta(); }
    // log de diagnóstico
    let totalRemoto=0; for(const st of SYNCST) totalRemoto+=(data.datos[st]||[]).length;
    console.log('[BAJADA] remoto total:',totalRemoto,'guardados:',n,'cursor:',usarCursor);
    return n;
  }catch(e){ ultimoErrorBajada='No se pudo conectar con Google. '+e.message; return -1; } }

let toastTimer=null;
function toast(msg,undoFn){ const t=$('#toast'); t.innerHTML=''; t.appendChild(document.createTextNode(msg));
  if(undoFn){ const b=document.createElement('button'); b.textContent='Deshacer'; b.onclick=()=>{ undoFn(); t.classList.remove('show'); }; t.appendChild(b); }
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), undoFn?5000:2200); }

function openModal(title, bodyNode, {okText='Guardar', onOk=null}={}){
  const ov=h('<div class="modal-ov"></div>');
  const sheet=h(`<div class="modal-sheet"><div class="modal-head"><b>${title}</b><button class="modal-x" aria-label="Cerrar">✕</button></div><div class="modal-body"></div><div class="modal-actions"><button class="save modal-ok">${okText}</button></div></div>`);
  sheet.querySelector('.modal-body').appendChild(bodyNode); ov.appendChild(sheet); document.body.appendChild(ov);
  const close=()=>ov.remove();
  sheet.querySelector('.modal-x').onclick=close; ov.onclick=e=>{ if(e.target===ov) close(); };
  sheet.querySelector('.modal-ok').onclick=()=>{ if(onOk) onOk(close); else close(); };
  return {close,sheet};
}

async function abrirKpi(tipo){
  // Ganancia, Ingresos, Gastos, Jornales, Caja -> historial filtrado. Leche/Cacao/Vacas -> su pantalla.
  if(tipo==='leche'){ show('leche'); return; }
  if(tipo==='vacas'){ show('animales'); return; }
  if(tipo==='caja'){ show('caja'); return; }
  if(tipo==='ingresos'||tipo==='cacao'){ show('movimientos','ventas'); return; }
  if(tipo==='gastos'){ show('movimientos','gastos'); return; }
  if(tipo==='jornales'){ show('movimientos','trabajador'); return; }
  if(tipo==='ganancia'){ show('analisis'); return; }
  show('movimientos','todos');
}

function chipGroup(items,value,onPick,{gold=false,onAdd=null}={}){
  const wrap=h('<div class="chips"></div>');
  items.forEach(it=>{ const c=h(`<button type="button" class="chip${gold?' gold':''}">${it}</button>`); if(it===value)c.classList.add('sel');
    c.onclick=()=>{ wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); onPick(it); }; wrap.appendChild(c); });
  if(onAdd){ const a=h('<button type="button" class="chip add">+ Otro</button>'); a.onclick=()=>askText('Nuevo','Nombre','',v=>onAdd(v)); wrap.appendChild(a); }
  return wrap;
}

  calendarPicker(el.querySelector('#cal'), st.dias, onCalChange); onCalChange();

  el.querySelector('#save').onclick=async()=>{ if(st.dias.size===0){ toast('Marca al menos un día'); return; }
    const dias=[...st.dias].sort();
    // un registro POR día
    let ultimo=null;
    for(const k of dias){ const det=st.detalle[k];

      await put('registros',reg); ultimo=reg; }
    let tot=0; dias.forEach(k=>tot+=num(st.detalle[k].pagoP));
    toast(`Guardado: ${st.nombre} · ${dias.length} día(s) · ${money(tot)}`);
    show('finanzas'); actualizarSync(); sincronizar(); };
  return el;
};

function calendarPicker(container, selectedSet, onChange){
  let cur=new Date(); cur.setDate(1);
  function iso(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function render(){ container.innerHTML='';
    const wrap=h('<div class="cal" style="background:var(--surface);border-radius:16px;padding:12px 10px 6px;box-shadow:var(--shadow-card)"></div>');
    const head=h(`<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px"><button type="button" style="width:40px;height:40px;border:none;background:transparent;color:var(--accent);border-radius:50%;font-size:1.5rem" data-prev>‹</button><span style="font-weight:700"></span><button type="button" style="width:40px;height:40px;border:none;background:transparent;color:var(--accent);border-radius:50%;font-size:1.5rem" data-next>›</button></div>`);
    head.querySelector('span').textContent=MESES[cur.getMonth()]+' '+cur.getFullYear();
    head.querySelector('[data-prev]').onclick=()=>{ cur.setMonth(cur.getMonth()-1); render(); };
    head.querySelector('[data-next]').onclick=()=>{ cur.setMonth(cur.getMonth()+1); render(); };
    wrap.appendChild(head);
    const grid=h('<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px"></div>');
    ['L','M','X','J','V','S','D'].forEach(d=>grid.appendChild(h(`<div style="text-align:center;font-size:.72rem;color:var(--secondary);font-weight:600;padding:2px 0 6px">${d}</div>`)));
    const first=new Date(cur.getFullYear(),cur.getMonth(),1); const start=(first.getDay()+6)%7; const days=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
    for(let i=0;i<start;i++) grid.appendChild(h('<div></div>'));
    const hoyK=hoyISO();
    for(let d=1;d<=days;d++){ const k=iso(cur.getFullYear(),cur.getMonth(),d);
      const cell=h(`<button type="button" style="aspect-ratio:1;border:none;background:transparent;border-radius:50%;font-size:1.02rem;font-weight:500;color:var(--label);position:relative">${d}</button>`);
      const esPasado = k<hoyK; const esHoy = k===hoyK;
      if(esPasado){ cell.style.color='var(--tertiary)'; cell.style.textDecoration='line-through'; cell.style.textDecorationColor='var(--tertiary)'; }
      if(esHoy){ cell.style.boxShadow='inset 0 0 0 1.5px var(--accent)'; cell.style.fontWeight='700'; }
      if(selectedSet.has(k)){ cell.style.background='var(--accent)'; cell.style.color='#fff'; cell.style.fontWeight='700'; cell.style.textDecoration='none'; }
      cell.onclick=()=>{ if(selectedSet.has(k)){selectedSet.delete(k);cell.style.background='transparent';cell.style.color='var(--label)';cell.style.fontWeight='500';} else {selectedSet.add(k);cell.style.background='var(--accent)';cell.style.color='#fff';cell.style.fontWeight='700';} onChange(); };
      grid.appendChild(cell); }
    wrap.appendChild(grid); container.appendChild(wrap);
  }
  render();
}

async function saldoCaja(){ const rec=await vivos('caja'); const regs=await vivos('registros');
  const entra=rec.reduce((t,r)=>t+num(r.monto),0);
  const sale=regs.filter(r=>r.caja===true&&r.categoria==='Egreso').reduce((t,r)=>t+num(r.total),0);
  return Math.round((entra-sale)*100)/100; }

async function pintarGaleria(cont, a){
  cont.innerHTML='';
  const items=(await vivos('galeria')).filter(x=>x.animalId===a.id).sort((x,y)=>y.fecha.localeCompare(x.fecha));

  const inp=h('<input type="file" accept="image/*" hidden>');
  add.onclick=()=>inp.click();
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f)return; let b; try{ b=await comprimir(f,1280,0.7); }catch{ b=f; }
    nuevaFotoGaleria(a,b,cont); inp.value=''; };
  grid.appendChild(add); grid.appendChild(inp);
  for(const it of items){
    const cell=h(`<button type="button" class="galcell"><span class="cap">${it.fecha.slice(5).replace('-','/')}</span></button>`);
    const src=await fotoSrc(it);
    if(src){ const img=h(`<img alt="${it.nota||''}" src="${src}">`); cell.insertBefore(img,cell.firstChild); }
    cell.onclick=()=>verFotoGrande(it,src,a,cont);
    grid.appendChild(cell);
  }
  cont.appendChild(grid);
  if(!items.length) cont.appendChild(h(`<p class="hint">Guarda fotos de cómo va la vaca: crecimiento, heridas, preñez. Cada una queda con su fecha.</p>`));
}

async function vacunacionGrupal(){
  const animales=(await vivos('animales')).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  if(!animales.length){ toast('Primero agrega vacas'); return; }
  const sel=new Set();
  const body=h(`<div>
    <div class="field"><label>Tipo</label><select id="vtipo">${opts(TIPO_SALUD,'Vacuna')}</select></div>
    <div class="field"><label>Producto / vacuna</label><input type="text" id="vprod" placeholder="Ej: Carbunco / Fiebre aftosa"></div>
    <div class="field"><label>Fecha</label><input type="date" id="vfec" value="${hoyISO()}"></div>
    <div class="field"><label>Nota <span class="soft">· opcional</span></label><input type="text" id="vnota" placeholder="Dosis, lote…"></div>
    <div class="field"><label>¿A cuáles vacas? <span class="soft">· toca para marcar</span></label>
      <button type="button" class="linkbtn" id="todas" style="padding:4px">Marcar todas</button>
      <div class="lgroup" id="vlista"></div></div></div>`);
  const lista=body.querySelector('#vlista');
  animales.forEach(a=>{ const row=h(`<button type="button" class="grow tap"><span class="gtx"><b>${a.nombre||'Sin nombre'}</b><small>${a.raza||''}${a.estado?' · '+a.estado:''}</small></span><span class="badge-s b-slate" style="min-width:26px;text-align:center">○</span></button>`);
    const badge=row.querySelector('.badge-s');
    row.onclick=()=>{ if(sel.has(a.id)){ sel.delete(a.id); badge.textContent='○'; badge.className='badge-s b-slate'; } else { sel.add(a.id); badge.textContent='✓'; badge.className='badge-s b-green'; } };
    lista.appendChild(row); });
  body.querySelector('#todas').onclick=()=>{ const marcarTodas=sel.size<animales.length; sel.clear();
    lista.querySelectorAll('.grow').forEach((row,i)=>{ const badge=row.querySelector('.badge-s'); if(marcarTodas){ sel.add(animales[i].id); badge.textContent='✓'; badge.className='badge-s b-green'; } else { badge.textContent='○'; badge.className='badge-s b-slate'; } });
    body.querySelector('#todas').textContent=marcarTodas?'Quitar todas':'Marcar todas'; };
  openModal('Vacunar varias vacas',body,{okText:'Guardar',onOk:async close=>{
    if(sel.size===0){ toast('Marca al menos una vaca'); return; }

    n.querySelector('[data-prev]').onclick=()=>{ anaAnio--; show('analisis'); }; n.querySelector('[data-next]').onclick=()=>{ anaAnio++; show('analisis'); }; nav.appendChild(n); }
  (async()=>{ const cont=el.querySelector('#cont'); const regs=await vivos('registros'); const prod=await vivos('produccion'); const leche=await vivos('leche'); const hoy=hoyISO();
    const enP=r=> anaPeriodo==='dia'?r.fecha===hoy : anaPeriodo==='semana'?mismaSemana(r.fecha,hoy) : anaPeriodo==='mes'?ymDe(r.fecha)===anaMes : String(parseFecha(r.fecha).getFullYear())===String(anaAnio);

    if(Object.keys(egrTot).length){ cont.appendChild(donaCard('EN QUÉ SE VA EL DINERO', egrTot, tE)); }

    // --- cacao por estado: barras ---

    if(cacaoVentas.length){ const porEstado={},platEstado={};

      const card=h('<div class="card"><h3>CACAO VENDIDO POR ESTADO</h3></div>');

      cont.appendChild(card); }

    // --- producción + leche: mini stats ---

      if(litros) card.appendChild(h(`<div class="line"><span class="k">Leche</span><span class="v">${litros} L</span></div>`));
      cont.appendChild(card); }

    // --- evolución diaria con filtros ---
    const chartCard=h(`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">DÍA A DÍA</h3></div>

    chartCard.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ anaVista=b.dataset.v; show('analisis'); });
    cont.appendChild(chartCard);
  })();
  return el;
};
function graficoBarras(regs, vista='ambos'){ const byDay={}; regs.forEach(r=>{ byDay[r.fecha]=byDay[r.fecha]||{i:0,e:0}; if(r.categoria==='Ingreso')byDay[r.fecha].i+=r.total; else byDay[r.fecha].e+=r.total; });
  const dias=Object.keys(byDay).sort().slice(-12); if(!dias.length)return h('<p class="hint" style="text-align:center">Sin movimientos para graficar.</p>');
  const verI=vista!=='egresos', verE=vista!=='ingresos';
  const max=Math.max(1,...dias.map(d=>Math.max(verI?byDay[d].i:0, verE?byDay[d].e:0)));
  const W=460,H=190,pad=26,bh=H-52,bw=(W-pad*2)/dias.length; let bars='',ptsI=[],ptsE=[];
  dias.forEach((d,i)=>{ const cx=pad+i*bw+bw/2; const ih=byDay[d].i/max*bh, eh=byDay[d].e/max*bh;
    if(vista==='ambos'){ const w=bw*0.3;
      bars+=`<rect x="${cx-w-2}" y="${H-30-ih}" width="${w}" height="${ih}" rx="3" fill="#1AA968"/><rect x="${cx+2}" y="${H-30-eh}" width="${w}" height="${eh}" rx="3" fill="#D9603F"/>`;
    } else { const w=bw*0.44; const val=vista==='ingresos'?ih:eh; const col=vista==='ingresos'?'#1AA968':'#D9603F';
      bars+=`<rect x="${cx-w/2}" y="${H-30-val}" width="${w}" height="${val}" rx="4" fill="${col}"/>`;
      const monto=vista==='ingresos'?byDay[d].i:byDay[d].e; if(monto>0) bars+=`<text x="${cx}" y="${H-34-val}" text-anchor="middle" font-size="10" font-weight="700" fill="#8A8A8F">${Math.round(monto)}</text>`; }
    ptsI.push([cx,H-30-ih]); ptsE.push([cx,H-30-eh]);
    const dd=d.split('-'); bars+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="10" fill="#8A8A8F">${+dd[2]}/${+dd[1]}</text>`; });
  let leyenda='';
  if(vista==='ambos') leyenda=`<div class="legend"><span><i style="background:#1AA968"></i>Ingresos</span><span><i style="background:#D9603F"></i>Egresos</span></div>`;
  else leyenda=`<div class="legend"><span><i style="background:${vista==='ingresos'?'#1AA968':'#D9603F'}"></i>${vista==='ingresos'?'Ingresos':'Egresos'} por día</span></div>`;
  return h(`<div><div class="chart"><svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-30}" x2="${W-pad+6}" y2="${H-30}" stroke="#E4E4E9" stroke-width="1"/>${bars}</svg></div>${leyenda}</div>`); }

// dona (pie) para desglose de egresos
function donaCard(titulo, obj, total){
  const entradas=Object.entries(obj).sort((a,b)=>b[1]-a[1]); const suma=total||entradas.reduce((s,[,v])=>s+v,0)||1;
  const cols=['#BB4D2C','#D9603F','#E08B5C','#B8871C','#C89A3A','#5E6B78','#1B3A5B','#137A4F'];
  const R=52,C=64,cir=2*Math.PI*R; let off=0,segs='',leyenda='';
  entradas.forEach(([k,v],i)=>{ const frac=v/suma; const len=frac*cir; const col=cols[i%cols.length];
    segs+=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${col}" stroke-width="20" stroke-dasharray="${len} ${cir-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${C} ${C})"/>`;
    off+=len;
    leyenda+=`<div class="dl"><span class="dd" style="background:${col}"></span><span class="dk">${k}</span><span class="dv">${money(v)} · ${Math.round(frac*100)}%</span></div>`; });
  const card=h(`<div class="card"><h3>${titulo}</h3>
    <div class="donawrap"><svg viewBox="0 0 128 128" class="dona">${segs}<text x="64" y="60" text-anchor="middle" font-size="11" fill="#8A8A8F" font-weight="600">Total</text><text x="64" y="76" text-anchor="middle" font-size="14" fill="#211A14" font-weight="800">${money(suma)}</text></svg>
    <div class="donaleg">${leyenda}</div></div></div>`);
  return card;
}

  function renderVacas(){ const c=el.querySelector('#vacas'); c.innerHTML=''; plan.vacas.forEach((t,i)=>{ const row=h(`<div class="plan-item"><span class="n">${i+1}</span><input class="tx" value=""><button type="button" class="rm">✕</button></div>`);

  renderTareas();

  el.querySelector('#addtarea').onclick=agregar;

  // si es nueva, crear el registro de una vez para que exista (con vacas)
  if(esNueva) guardar();
  return el;

async function compartir(blob,filename){ try{ const file=new File([blob],filename,{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Tareas Finca La Esperanza'}); return; } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); toast('Imagen descargada'); }
async function generarPlanImagen(plan){
  const W=1080,PAD=64,logo=await loadImg('logo.jpg'); const c=document.createElement('canvas'),ctx=c.getContext('2d');
  const fTitle='800 56px -apple-system,Arial',fSub='700 30px -apple-system,Arial',fSec='800 30px -apple-system,Arial',fItem='400 30px -apple-system,Arial',fNum='800 30px -apple-system,Arial';
  function wrap(text,maxW,font){ ctx.font=font; const words=text.split(' '); const lines=[]; let ln=''; for(const w of words){ const t=ln?ln+' '+w:w; if(ctx.measureText(t).width>maxW&&ln){ lines.push(ln); ln=w; } else ln=t; } if(ln)lines.push(ln); return lines; }
  const titleLines=[(plan.modo==='hechas'?'TAREAS REALIZADAS':'TAREAS'),'FINCA LA ESPERANZA']; const contentW=W-PAD*2,itemIndent=54,itemW=contentW-itemIndent;
  const sec1='TAREAS TODOS LOS DÍAS (LUNES A DOMINGO) - VACAS'; const sec2=plan.modo==='hechas'?'TAREAS REALIZADAS':'TAREAS DE LUNES A VIERNES'; const vacas=plan.vacas.filter(x=>x&&x.trim());
  let H=44+titleLines.length*62+6+44+30; function blockH(hd,items){ let hh=wrap(hd,contentW,fSec).length*38+20; items.forEach(it=>{ hh+=wrap(it,itemW,fItem).length*40+8; }); return hh+24; }
  H+=blockH(sec1,vacas)+blockH(sec2,plan.tareas)+50; c.width=W; c.height=H; ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
  if(logo){ const ls=190; ctx.drawImage(logo,W-PAD-ls,30,ls,ls); }
  let y=64; ctx.textBaseline='alphabetic'; ctx.fillStyle='#137A4F'; titleLines.forEach(t=>{ ctx.font=fTitle; ctx.fillText(t,PAD,y+46); y+=62; });
  y+=2; ctx.fillStyle='#3a3a3a'; ctx.font=fSub; ctx.fillText(plan.semana,PAD,y+30); y+=52; ctx.strokeStyle='#B8871C'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); y+=34;
  function drawBlock(hd,items,color,startNum){ ctx.fillStyle=color; ctx.font=fSec; wrap(hd,contentW,fSec).forEach(l=>{ ctx.fillText(l,PAD,y+28); y+=38; }); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PAD,y-4); ctx.lineTo(W-PAD,y-4); ctx.stroke(); y+=18;
    items.forEach((it,idx)=>{ const lines=wrap(it,itemW,fItem); ctx.fillStyle=color; ctx.font=fNum; ctx.fillText((startNum+idx)+'.',PAD,y+26); ctx.fillStyle='#211A14'; ctx.font=fItem; lines.forEach((l,li)=>{ ctx.fillText(l,PAD+itemIndent,y+26+li*40); }); y+=lines.length*40+8; }); y+=24; }
  drawBlock(sec1,vacas,'#1B3A5B',1); drawBlock(sec2,plan.tareas,'#137A4F',vacas.length+1);
  return await new Promise(res=>c.toBlob(b=>res(b),'image/png',0.92));
}

function pdfJornalesRango(){
  const hoy=hoyISO(); const d=new Date(); d.setDate(d.getDate()-30);
  const hace30=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const body=h(`<div>
    <div class="field"><label>Desde</label><input type="date" id="desde" value="${hace30}"></div>
    <div class="field"><label>Hasta</label><input type="date" id="hasta" value="${hoy}"></div>
    <p class="hint">Se hace un PDF solo con los jornales (mano de obra) entre esas dos fechas, con el total a pagar.</p></div>`);
  openModal('PDF de jornales',body,{okText:'Generar PDF',onOk:async close=>{
    const desde=body.querySelector('#desde').value, hasta=body.querySelector('#hasta').value;
    if(!desde||!hasta){ toast('Elige las dos fechas'); return; }
    close(); await imprimirJornales(desde,hasta); }});

async function imprimirJornales(desde,hasta){
  const d1=desde<hasta?desde:hasta, d2=desde<hasta?hasta:desde;
  const jor=(await vivos('registros')).filter(r=>r.tipo==='Trabajador'&&r.fecha>=d1&&r.fecha<=d2).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!jor.length){ toast('No hay jornales en ese rango'); return; }
  // agrupar por trabajador
  const porTrab={}; let total=0, totalDias=0, totalPend=0;
  jor.forEach(r=>{ (porTrab[r.nombreDesc]=porTrab[r.nombreDesc]||[]).push(r); total+=num(r.total); totalDias+=num(r.cantidad); if(r.pagado===false) totalPend+=num(r.total); });
  let secciones='';
  Object.keys(porTrab).sort().forEach(nom=>{ const lista=porTrab[nom]; let sub=0,subd=0;
    let filas='';
    lista.forEach(r=>{ sub+=num(r.total); subd+=num(r.cantidad); const estado=r.pagado===false?'<span style="color:#BB4D2C">Pendiente</span>':'<span style="color:#137A4F">Pagado</span>';
      filas+=`<tr><td style="padding:5px 4px;border-bottom:1px solid #eee">${r.fecha}</td><td style="padding:5px 4px;border-bottom:1px solid #eee">${(r.pagoTipo||(r.detalle||'').split(' · ')[0]||'').replace(/</g,'')}</td><td style="padding:5px 4px;border-bottom:1px solid #eee">${(r.actividad||r.notas||'').replace(/</g,'')||'—'}</td><td style="padding:5px 4px;border-bottom:1px solid #eee;text-align:center">${estado}</td><td style="padding:5px 4px;border-bottom:1px solid #eee;text-align:right;font-weight:600">${money(r.total)}</td></tr>`; });
    secciones+=`<div style="margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center;background:#E4F1EA;border-radius:8px;padding:8px 12px;margin-bottom:6px"><span style="font-weight:800;color:#137A4F">${nom}</span><span style="font-weight:700">${subd} día(s) · ${money(sub)}</span></div>
      <table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:#8A8A8F;font-size:11px"><th style="text-align:left;padding:2px 4px">Fecha</th><th style="text-align:left">Tipo</th><th style="text-align:left">Actividad</th><th style="text-align:center">Estado</th><th style="text-align:right">Pago</th></tr>${filas}</table></div>`; });
  const fmt=iso=>{ const [y,m,dd]=iso.split('-'); return `${+dd}/${+m}/${y}`; };
  $('#printarea').innerHTML=`<div style="font-family:-apple-system,Arial;color:#211A14;padding:24px;max-width:720px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:16px;border-bottom:3px solid #B8871C;padding-bottom:14px;margin-bottom:8px"><img src="logo.jpg" style="width:82px;height:82px;border-radius:50%;object-fit:cover" onerror="this.style.display='none'"><div><div style="font-size:24px;font-weight:800;color:#137A4F;line-height:1.1">REPORTE DE JORNALES</div><div style="font-size:16px;font-weight:700">FINCA LA ESPERANZA</div><div style="color:#8A8A8F">Del ${fmt(d1)} al ${fmt(d2)}</div></div></div>
    <div style="display:flex;gap:10px;margin:14px 0">
      <div style="flex:1;background:#F2F2F6;border-radius:10px;padding:10px 14px"><div style="font-size:11px;color:#8A8A8F;font-weight:600">DÍAS TRABAJADOS</div><div style="font-size:22px;font-weight:800">${totalDias}</div></div>
      <div style="flex:1;background:#F2F2F6;border-radius:10px;padding:10px 14px"><div style="font-size:11px;color:#8A8A8F;font-weight:600">TOTAL A PAGAR</div><div style="font-size:22px;font-weight:800;color:#137A4F">${money(total)}</div></div>
      ${totalPend>0?`<div style="flex:1;background:#FBE6E2;border-radius:10px;padding:10px 14px"><div style="font-size:11px;color:#BB4D2C;font-weight:600">PENDIENTE</div><div style="font-size:22px;font-weight:800;color:#BB4D2C">${money(totalPend)}</div></div>`:''}
    </div>
    ${secciones}
    <div style="margin-top:26px;color:#8A8A8F;font-size:12px;text-align:center">Finca La Esperanza · generado ${fmt(hoyISO())}</div></div>`;
  setTimeout(()=>window.print(),120);
}

async function imprimirReporte(per){
  const regs=(await vivos('registros')).filter(r=>r.categoria==='Ingreso'||r.categoria==='Egreso'); const prod=await vivos('produccion'); const leche=await vivos('leche'); const hoy=hoyISO();
  const enP=r=> per==='mes'?ymDe(r.fecha)===ymActual():mismaSemana(r.fecha,hoy);
  const filt=regs.filter(enP).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const ing={},egr={}; let mano=0,tI=0,tE=0; filt.forEach(r=>{ if(r.categoria==='Ingreso'){ ing[r.nombreDesc]=(ing[r.nombreDesc]||0)+r.total; tI+=r.total; } else { tE+=r.total; if(r.tipo==='Trabajador')mano+=r.total; else egr[r.nombreDesc]=(egr[r.nombreDesc]||0)+r.total; } });
  const neta=tI-tE; const titulo=per==='mes'?'RESUMEN MENSUAL':'RESUMEN SEMANAL'; const sub=per==='mes'?ymLabel(ymActual()):('Semana '+semanaDe(hoy));
  const prP=prod.filter(enP); const byProd={}; prP.forEach(r=>{ const k=r.producto+' ('+(r.unidad||'')+')'; byProd[k]=(byProd[k]||0)+num(r.cantidad); });
  const litros=leche.filter(enP).reduce((s,r)=>s+num(r.litros),0);
  let filas=''; filt.forEach(r=>{ filas+=`<tr><td>${r.fecha}</td><td>${r.nombreDesc}</td><td>${r.detalle||''}</td><td style="text-align:right;color:${r.categoria==='Ingreso'?'#137A4F':'#BB4D2C'}">${r.categoria==='Ingreso'?'+':'−'}${money(r.total)}</td></tr>`; });
  const ingRows=Object.keys(ing).map(k=>`<tr><td>${k}</td><td style="text-align:right">${money(ing[k])}</td></tr>`).join('');
  const egrRows=(mano?`<tr><td>Mano de obra</td><td style="text-align:right">${money(mano)}</td></tr>`:'')+Object.keys(egr).map(k=>`<tr><td>${k}</td><td style="text-align:right">${money(egr[k])}</td></tr>`).join('');
  const prodRows=Object.keys(byProd).map(k=>`<tr><td>${k}</td><td style="text-align:right">${byProd[k]}</td></tr>`).join('')+(litros?`<tr><td>Leche (litros)</td><td style="text-align:right">${litros} L</td></tr>`:'');
  $('#printarea').innerHTML=`<div style="font-family:-apple-system,Arial;color:#211A14;padding:24px;max-width:720px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:16px;border-bottom:3px solid #B8871C;padding-bottom:14px;margin-bottom:18px"><img src="logo.jpg" style="width:88px;height:88px;border-radius:50%;object-fit:cover" onerror="this.style.display='none'"><div><div style="font-size:26px;font-weight:800;color:#137A4F;line-height:1.1">${titulo}</div><div style="font-size:18px;font-weight:700">FINCA LA ESPERANZA</div><div style="color:#8A8A8F">${sub}</div></div></div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tr><td style="font-weight:800;color:#137A4F;padding-bottom:6px">INGRESOS</td><td></td></tr>${ingRows||'<tr><td colspan="2" style="color:#8A8A8F">Sin ingresos</td></tr>'}<tr><td style="font-weight:800;border-top:1px solid #ccc;padding-top:6px">Total</td><td style="text-align:right;font-weight:800;border-top:1px solid #ccc;padding-top:6px">${money(tI)}</td></tr></table>
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tr><td style="font-weight:800;color:#BB4D2C;padding-bottom:6px">EGRESOS</td><td></td></tr>${egrRows||'<tr><td colspan="2" style="color:#8A8A8F">Sin egresos</td></tr>'}<tr><td style="font-weight:800;border-top:1px solid #ccc;padding-top:6px">Total</td><td style="text-align:right;font-weight:800;border-top:1px solid #ccc;padding-top:6px">${money(tE)}</td></tr></table>
    ${prodRows?`<table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tr><td style="font-weight:800;color:#B8871C;padding-bottom:6px">PRODUCCIÓN</td><td></td></tr>${prodRows}</table>`:''}
    <div style="display:flex;justify-content:space-between;align-items:center;background:#E4F1EA;border-radius:12px;padding:14px 18px;margin-bottom:22px"><span style="font-weight:800;font-size:18px">GANANCIA NETA</span><span style="font-weight:800;font-size:24px;color:${neta>=0?'#137A4F':'#BB4D2C'}">${money(neta)}</span></div>
    <div style="font-weight:800;color:#137A4F;margin-bottom:8px">DETALLE</div><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="border-bottom:2px solid #211A14"><th style="text-align:left;padding:6px 4px">Fecha</th><th style="text-align:left">Concepto</th><th style="text-align:left">Detalle</th><th style="text-align:right">Monto</th></tr>${filas||'<tr><td colspan="4" style="color:#8A8A8F;padding:8px 4px">Sin movimientos</td></tr>'}</table>
    <div style="margin-top:24px;color:#8A8A8F;font-size:12px;text-align:center">Finca La Esperanza · ${hoyISO()}</div></div>`;
  setTimeout(()=>window.print(),120);
}
async function exportarCSV(){ const regs=(await vivos('registros')).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const cols=['id','fecha','tipo','nombreDesc','detalle','cantidad','unidad','precio','total','categoria','comprador','notas','semana','comprobanteUrl','sync'];
  const head=['ID','Fecha','Tipo','Nombre','Detalle','Cantidad','Unidad','Precio','Total','Categoría','Comprador','Notas','Semana','Comprobante','Estado'];
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`; const rows=[head.join(',')].concat(regs.map(r=>cols.map(c=>esc(r[c])).join(',')));
  const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Finca_La_Esperanza_${hoyISO()}.csv`; a.click(); toast('Tabla descargada'); }

async function exportarJSON(){ toast('Preparando copia…'); const data={version:5,fecha:hoyISO(),meta:META};
  for(const s of ['registros','produccion','animales','leche','salud','inventario','caja','galeria']) data[s]=await all(s);
  const fotos=await all('fotos'); data.fotos=[]; for(const f of fotos){ if(f.blob){ try{ data.fotos.push({id:f.id,b64:await blob2b64(f.blob)}); }catch(e){} } }
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Backup_Finca_${hoyISO()}.json`; a.click(); toast('Copia exportada'); }
async function importarJSON(e){ const file=e.target.files[0]; if(!file)return; if(!confirm('Esto agregará/reemplazará los datos de la copia. ¿Continuar?'))return;
  try{ const txt=await file.text(); const data=JSON.parse(txt);
    for(const s of ['registros','produccion','animales','leche','salud','inventario','caja','galeria']) if(Array.isArray(data[s])) for(const r of data[s]) await put(s,r);
    if(Array.isArray(data.fotos)) for(const f of data.fotos){ if(f.b64){ try{ await put('fotos',{id:f.id,blob:b642blob(f.b64)}); }catch(e){} } }
    if(data.meta){ META=Object.assign({},DEFAULTS,data.meta); await saveMeta(); }
    toast('Copia importada'); actualizarSync(); show('home'); }
  catch(err){ toast('Archivo no válido'); } }


async function diagnostico(cont){
  cont.innerHTML=''; const card=h('<div class="card"><h3>DIAGNÓSTICO</h3></div>'); cont.appendChild(card);
  const paso=(t,estado,extra)=>{ const col=estado==='ok'?'var(--accent)':estado==='mal'?'var(--danger)':'var(--secondary)';
    card.appendChild(h(`<div class="line"><span class="k">${t}</span><span class="v" style="color:${col}">${estado==='ok'?'✓':estado==='mal'?'✗':'…'}</span></div>`));
    if(extra) card.appendChild(h(`<p class="hint" style="margin:2px 4px 8px">${extra}</p>`)); };

  if(!online()){ paso('Internet','mal','El teléfono no tiene conexión.'); return; }
  paso('Internet','ok');
  if(!META.appsUrl){ paso('Dirección del script','mal','Está vacía. Pégala arriba y guarda.'); return; }
  if(META.appsUrl.indexOf('/exec')<0){ paso('Dirección del script','mal','Debe terminar en /exec. La que tienes no.'); return; }
  paso('Dirección del script','ok');

  let txt='';
  try{
    const resp=await fetch(META.appsUrl+'?token='+encodeURIComponent(META.token),{method:'GET'});
    txt=await resp.text();
  }catch(e){ paso('Google responde','mal','No se pudo conectar. Puede ser la señal, o el script no está publicado para "Cualquiera".'); return; }
  paso('Google responde','ok');

  let data=null; try{ data=JSON.parse(txt); }catch(e){}
  if(!data){
    if(txt.indexOf('Finca La Esperanza')>=0){
      paso('Versión del script','mal','<b>Este es el problema.</b> El script de Google todavía es la versión vieja: recibe datos pero no los entrega. Hay que pegar el código nuevo y volver a implementarlo (Implementar › Gestionar implementaciones › ✏️ › Nueva versión).');
    } else {
      paso('Versión del script','mal','Google devolvió algo que no se entiende. Revisa que esté implementado como "Aplicación web", ejecutando "como Yo" y con acceso para "Cualquiera".');
    }
    return;
  }
  paso('Versión del script','ok');
  if(!data.ok){
    paso('Token','mal', data.error==='token' ? 'El token de la app no coincide con el del script. En el script busca la línea <b>const TOKEN</b> y ponle el mismo de arriba.' : 'Error: '+data.error);
    return;
  }
  paso('Token','ok');

  let totalServidor=0; const detalle=[];
  for(const st of SYNCST){ const n=(data.datos[st]||[]).length; totalServidor+=n; if(n) detalle.push(`${st}: ${n}`); }
  let totalLocal=0; for(const st of SYNCST) totalLocal+=(await vivos(st)).length;
  paso('Datos en Google','ok', totalServidor? detalle.join(' · ') : 'La hoja está vacía todavía.');
  card.appendChild(h(`<div class="line"><span class="k">En este teléfono</span><span class="v">${totalLocal}</span></div>`));
  const pend=(await pendientes()).length;
  card.appendChild(h(`<div class="line"><span class="k">Sin subir</span><span class="v" style="color:${pend?'var(--gold)':'var(--accent)'}">${pend}</span></div>`));
  cont.appendChild(h(`<p class="hint"><b>Todo bien.</b> Si aún ves distinto en otro teléfono, toca "Sincronizar ahora" en los dos.</p>`));
  const b=h(`<button class="save" style="margin-top:8px">Sincronizar ahora</button>`);
  b.onclick=async()=>{ b.textContent='Sincronizando…'; await sincronizar(true); show('config'); };
  cont.appendChild(b);
}

    META.ultimaBajada=0; META.ultimaSubida=0; bajadaCompletaHecha=false; await saveMeta();
    // limpiar stores y forzar bajada completa
    try{
      for(const st of SYNCST){
        if(useMem){ M(st).clear(); }
        else { await new Promise((res)=>{ const r=txs(st,'readwrite').clear(); r.onsuccess=res; r.onerror=res; }); }
      }
    }catch(e){}
    META.ultimaBajada=0; bajadaCompletaHecha=false;
    const n=await bajar();
    if(n>0) toast(`✓ Bajados ${n} registros`);

    else toast('Error: '+ultimoErrorBajada);
    show('config'); };
  return el;
};

  actualizarSync(); sincronizar();
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
